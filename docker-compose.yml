# =============================================================================
# SISTEMA DE BIBLIOTECA DIGITAL — SENA ADSO (Ficha 3239188)
# Despliegue Automatizado de Base de Datos Relacional (MySQL 8.0 - InnoDB)
# Responsable de Base de Datos: Juan Diego Oteca Pedreros (@joteca3-afk)
# =============================================================================

services:
  mysql-db:
    image: mysql:8.0
    container_name: biblioteca_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-digital_library}
      MYSQL_USER: ${MYSQL_USER:-biblioteca_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-biblioteca1234}
      TZ: America/Bogota
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mysql_biblioteca_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD:-root1234}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_biblioteca_data:
    name: digital_library_mysql_data
